<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">BSV MCP system design</title>
  <desc id="desc">ChatGPT, Codex and Claude connect through an MCP client to bsvmcp.com. Sigma Identity authorizes access, while BSV tools use the 1Sat API. Local MCP connects to a BRC-100 wallet or signer for user-approved signed transactions. x402 payments require a quote and user approval.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#252a2b" stroke-width="1"/></pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65b7ff"/></marker>
    <marker id="arrow-lime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b7f34a"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ffb454"/></marker>
    <style>
      .eyebrow { fill:#8a9695; font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:2px; }
      .heading { fill:#f1f4ed; font:700 30px ui-sans-serif,system-ui,sans-serif; }
      .subhead { fill:#aeb8b5; font:400 16px ui-sans-serif,system-ui,sans-serif; }
      .label { fill:#f1f4ed; font:650 20px ui-sans-serif,system-ui,sans-serif; }
      .small { fill:#aeb8b5; font:400 14px ui-sans-serif,system-ui,sans-serif; }
      .mono { fill:#b7f34a; font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .panel { fill:#171b1c; stroke:#3a4241; stroke-width:1.5; }
      .panel-blue { fill:#151d24; stroke:#37617a; stroke-width:1.5; }
      .panel-lime { fill:#1b2114; stroke:#647c31; stroke-width:1.5; }
      .panel-orange { fill:#241b12; stroke:#8d5b25; stroke-width:1.5; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="#101313"/>
  <rect x="24" y="24" width="1552" height="912" rx="22" fill="url(#grid)"/>
  <text x="72" y="82" class="eyebrow">BSV MCP · SYSTEM DESIGN</text>
  <text x="72" y="126" class="heading">One service, two wallet paths</text>
  <text x="72" y="158" class="subhead">Hosted authorization and local signing stay separate.</text>

  <rect x="72" y="210" width="250" height="116" rx="14" class="panel"/>
  <text x="102" y="252" class="label">ChatGPT / Codex</text>
  <text x="102" y="280" class="small">Claude · any MCP client</text>
  <text x="102" y="307" class="mono">client</text>

  <rect x="388" y="210" width="250" height="116" rx="14" class="panel-blue"/>
  <text x="418" y="252" class="label">MCP client</text>
  <text x="418" y="280" class="small">OAuth 2.1 + PKCE</text>
  <text x="418" y="307" class="mono">Authorization: Bearer</text>

  <rect x="704" y="210" width="292" height="116" rx="14" class="panel-lime"/>
  <text x="734" y="252" class="label">bsvmcp.com</text>
  <text x="734" y="280" class="small">Protected MCP resource</text>
  <text x="734" y="307" class="mono">tools/list · tools/call</text>

  <rect x="1062" y="210" width="320" height="116" rx="14" class="panel-blue"/>
  <text x="1092" y="252" class="label">Sigma Identity</text>
  <text x="1092" y="280" class="small">Better Auth OAuth provider</text>
  <text x="1092" y="307" class="mono">login · consent · tokens</text>

  <path d="M322 268H388" stroke="#65b7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M638 268H704" stroke="#65b7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M996 248H1062" stroke="#65b7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="1012" y="232" class="small">authorize</text>
  <path d="M1062 294H996" stroke="#b7f34a" stroke-width="3" marker-end="url(#arrow-lime)"/>
  <text x="1008" y="318" class="small">access token</text>

  <rect x="704" y="392" width="292" height="132" rx="14" class="panel"/>
  <text x="734" y="434" class="label">BSV tools</text>
  <text x="734" y="462" class="small">prices · transactions · ordinals</text>
  <text x="734" y="490" class="small">wallet tools when a signer is attached</text>
  <text x="734" y="514" class="mono">least privilege by capability</text>
  <path d="M850 326V392" stroke="#b7f34a" stroke-width="3" marker-end="url(#arrow-lime)"/>

  <rect x="1062" y="392" width="320" height="132" rx="14" class="panel"/>
  <text x="1092" y="434" class="label">1Sat API</text>
  <text x="1092" y="462" class="small">default public backend</text>
  <text x="1092" y="490" class="mono">api.1sat.app</text>
  <text x="1092" y="514" class="small">configurable for compatible deployments</text>
  <path d="M996 456H1062" stroke="#65b7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="72" y="622" width="1310" height="236" rx="18" fill="#141817" stroke="#3a4241" stroke-width="1.5"/>
  <text x="104" y="666" class="eyebrow">LOCAL SPENDING BOUNDARY</text>
  <text x="104" y="704" class="heading" style="font-size:24px">Private keys stay in the wallet</text>

  <rect x="104" y="744" width="230" height="78" rx="12" class="panel"/>
  <text x="134" y="778" class="label" style="font-size:18px">Local MCP</text>
  <text x="134" y="802" class="small">stdio on your computer</text>
  <rect x="404" y="744" width="260" height="78" rx="12" class="panel-blue"/>
  <text x="434" y="778" class="label" style="font-size:18px">BRC-100 wallet / signer</text>
  <text x="434" y="802" class="small">keys and permissions</text>
  <rect x="734" y="744" width="206" height="78" rx="12" class="panel-lime"/>
  <text x="764" y="778" class="label" style="font-size:18px">User approval</text>
  <text x="764" y="802" class="small">review amount + fee</text>
  <rect x="1010" y="744" width="232" height="78" rx="12" class="panel-orange"/>
  <text x="1040" y="778" class="label" style="font-size:18px">Signed transaction</text>
  <text x="1040" y="802" class="small">broadcast only after approval</text>
  <path d="M334 783H404" stroke="#b7f34a" stroke-width="3" marker-end="url(#arrow-lime)"/>
  <path d="M664 783H734" stroke="#b7f34a" stroke-width="3" marker-end="url(#arrow-lime)"/>
  <path d="M940 783H1010" stroke="#ffb454" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="1154" y="558" width="228" height="78" rx="12" class="panel-orange"/>
  <text x="1184" y="591" class="label" style="font-size:17px">x402 service payment</text>
  <text x="1184" y="615" class="small">quote → approval → BSV</text>
  <path d="M996 492C1070 492 1115 560 1154 582" fill="none" stroke="#ffb454" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="72" y="908" class="small">Hosted sign-in identifies the user. Wallet approval authorizes spending.</text>
</svg>
